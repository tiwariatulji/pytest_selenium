<html>
<head>
    <title>Swagger UI</title>

</head>
<body>
    <div id="swagger-ui"></div>

            url: "https://github.com/tiwariatulji/pytest_selenium/blob/main/core_function/swagger.yml",
            dom_id: '#swagger-ui',
        });
    </script>
</body></html>
